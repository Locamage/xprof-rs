<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XProf</title>
  <script>
    const base = document.createElement("base");
    const defaultPath = '/data/plugin/profile';
    let newPath = defaultPath + '/';
    if (document.location.pathname.includes(defaultPath)) {
      newPath = document.location.pathname.split(defaultPath)[0] + defaultPath + '/';
    }
    base.setAttribute("href", newPath);
    const header = document.getElementsByTagName("head")[0];
    header.insertBefore(base, header.firstChild);
    // Static tags would resolve against the page URL before <base> exists, so the browser would fetch them twice.
    document.write('<link rel="stylesheet" href="styles.css"><link rel="preload" href="runtime.js" as="script"><link rel="preload" href="bundle.js" as="script"><script src="zone.js"><\/script>');
    // Each toLocaleString call with options builds a new Intl.NumberFormat, which takes 20 microseconds or more.
    (() => {
      'use strict';
      const toLocaleString = Number.prototype.toLocaleString, formats = new Map();
      const plain = (options) => options === undefined || (options !== null && Object.getPrototypeOf(options) === Object.prototype);
      Number.prototype.toLocaleString = function (locales, options) {
        if (typeof this !== 'number' || (locales !== undefined && typeof locales !== 'string') || !plain(options)) return toLocaleString.call(this, locales, options);
        const key = (locales ?? '') + JSON.stringify(options ?? {});
        let format = formats.get(key);
        if (!format) formats.set(key, (format = new Intl.NumberFormat(locales, options)));
        return format.format(this);
      };
    })();
  </script>
  <style>
    /* Google Charts puts all the rows of each chart in a table outside the page for screen readers. The layout of a
       large table takes more than one second, but the page does not show it. */
    div[aria-label="A tabular representation of the data in the chart."] { content-visibility: auto; }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <app></app>
  <script>
    let bundleLoaded = false;
    function loadBundle() {
      if (bundleLoaded) return;
      bundleLoaded = true;
      const runtimeScript = document.createElement('script');
      runtimeScript.src = 'runtime.js';
      document.body.appendChild(runtimeScript);
      runtimeScript.onload = () => {
        const bundleScript = document.createElement('script');
        bundleScript.src = 'bundle.js';
        document.body.appendChild(bundleScript);
      };
      runtimeScript.onerror = () => {
        // If runtime.js fails to load (e.g. Google3 build where runtime is pre-bundled in bundle.js),
        // fallback to loading bundle.js directly.
        const bundleScript = document.createElement('script');
        bundleScript.src = 'bundle.js';
        document.body.appendChild(bundleScript);
      };
    }

    function loadChart(domain) {
      const script = document.createElement('script');
      script.src = `https://${domain}/charts/loader.js`;
      document.body.appendChild(script);
      script.onload = () => {
        // The tools call google.visualization when their data arrives, so the packages must load first.
        google.charts.safeLoad({packages: ['corechart', 'table', 'line']});
        google.charts.setOnLoadCallback(loadBundle);
      };
      return script;
    }

    function setReloadOfIFrame() {
      try {
        const iFrame = window.parent?.document?.querySelector('iframe');
        if (iFrame) {
          iFrame.reload = () => {
            document.dispatchEvent(new Event('tensorboard-reload'));
          };
        }
      } catch (err) {
        console.error(err);
      }
    }

    const script = loadChart('www.gstatic.com');
    script.onerror = () => {
      script.onerror = null;
      if (script.parentNode) {
        document.body.removeChild(script);
      }

      if (!bundleLoaded) {
        const backupScript = loadChart('www.gstatic.cn');
        backupScript.onerror = () => {
          backupScript.onerror = null;
          if (backupScript.parentNode) {
            document.body.removeChild(backupScript);
          }
          loadBundle();
        };
      }
    };

    // Ensure Angular bundle boots within 2.5s even on offline/blocked networks
    setTimeout(() => {
      loadBundle();
    }, 2500);

    setReloadOfIFrame();
  </script>
</body>
</html>
