name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the version in Cargo.toml
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "${GITHUB_REF_NAME}"
      - name: The changelog must have a section for the version
        run: grep -qx "## ${GITHUB_REF_NAME#v}" CHANGELOG.md
      - name: The crate must build from its package
        run: cargo publish --dry-run --locked
  binary:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    strategy:
      matrix:
        include:
          # The Linux binary needs the glibc of the build system or newer. glibc 2.28 is in RHEL 8, Debian 10 and Ubuntu 20.04.
          - target: x86_64-linux
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - target: aarch64-macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --release
      - run: target/release/xprof-rs --help
      - name: The binary must not need a glibc newer than 2.28
        if: runner.os == 'Linux'
        run: |
          newest=$(objdump -T target/release/xprof-rs | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "$newest"
          test "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" = GLIBC_2.28
      - name: Make the archive
        run: |
          name=xprof-rs-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}
          mkdir "$name"
          cp target/release/xprof-rs LICENSE NOTICE README.md CHANGELOG.md "$name"
          tar -czf "$name.tar.gz" "$name"
          { sha256sum "$name.tar.gz" || shasum -a 256 "$name.tar.gz"; } > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: xprof-rs-*.tar.gz*
  publish:
    needs: binary
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Make a draft release with the changelog section of the version
        run: |
          awk -v version="## ${GITHUB_REF_NAME#v}" '$0 == version { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" xprof-rs-*.tar.gz* --draft --verify-tag --title "xprof-rs ${GITHUB_REF_NAME}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
