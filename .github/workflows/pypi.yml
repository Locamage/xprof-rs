name: pypi
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write
    steps:
      - run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern '*.whl' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
