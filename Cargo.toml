[package]
name = "xprof-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Fast Rust backend for the XProf trace viewer. Its output is the same as the output of XProf 2.23.2."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Locamage/xprof-rs"
keywords = ["profiler", "xprof", "tpu", "jax", "tracing"]
categories = ["development-tools::profiling"]
exclude = ["/tests", "/.github", "/docs"]

[dependencies]
anyhow = "1.0.104"
arcstr = "1.2.0"
axum = "0.8.9"
crc32fast = "1.5.2"
fancy-regex = "0.19.2"
flate2 = { version = "1.1.10", features = ["zlib-rs"], default-features = false }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap = "2.14.2"
itertools = "0.15.0"
itoa = "1.0.18"
libc = "0.2.189"
memchr = "2.8.3"
libmimalloc-sys = { version = "0.1.49", features = ["extended", "v2"] }
mimalloc = "0.1.52"
moka = { version = "0.12.16", features = ["future"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
object_store = { version = "0.14.2", features = ["gcp-base", "aws-base", "azure-base", "http-base", "reqwest", "ring"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustc-hash = "2.1.3"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport"] }
tonic-prost = "0.14.6"
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "compression-gzip"] }
unicode-ident = "1.0.26"
url = "2.5.8"
zstd = { version = "0.14.0", default-features = false }

[build-dependencies]
flate2 = { version = "1.1.10", features = ["zlib-rs"], default-features = false }
prost-build = "0.14.4"
prost-reflect = "0.16.5"
prost-types = "0.14.4"

[dev-dependencies]
prost-reflect = { version = "0.16.5", features = ["text-format"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", default-features = false, features = ["transport", "server", "router"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package]
object_store.opt-level = "s"
reqwest.opt-level = "s"
quick-xml.opt-level = "s"
chrono.opt-level = "s"
tonic.opt-level = "s"
url.opt-level = "s"
idna.opt-level = "s"
rustls-webpki.opt-level = "s"
rustls-platform-verifier.opt-level = "s"
h2.opt-level = "s"
hyper.opt-level = "s"
hyper-util.opt-level = "s"
rustls.opt-level = "s"
tonic-prost.opt-level = "s"
axum.opt-level = "s"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"
format_collect = "allow"
format_push_string = "allow"
inline_always = "allow"
match_same_arms = "allow"
needless_continue = "allow"
ref_option = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unwrap_used = "warn"
needless_collect = "warn"
redundant_clone = "warn"
